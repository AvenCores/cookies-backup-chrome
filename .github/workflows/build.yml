name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify sources
        run: |
          node --check popup.js
          node --check background.js
          node --check locales.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.firefox.json', 'utf8'))"
          node -e "
            const fs = require('fs');
            const assert = require('assert');
            const chrome = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const firefox = JSON.parse(fs.readFileSync('manifest.firefox.json', 'utf8'));
            // Chrome (MV3) only accepts service_worker, Firefox only runs scripts:
            // a single manifest cannot serve both, so the two files must differ
            // in exactly this section and nowhere else.
            assert.deepStrictEqual(chrome.background, { service_worker: 'background.js' });
            assert.deepStrictEqual(firefox.background, { scripts: ['background.js'] });
            delete chrome.background;
            delete firefox.background;
            assert.deepStrictEqual(chrome, firefox, 'manifest.json and manifest.firefox.json must differ only in background');
          "

      - name: Smoke tests
        run: node test/smoke.cjs

      - name: Read version from manifest
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"

      - name: Stage extension files
        run: |
          mkdir -p build/chromium build/firefox
          cp manifest.json popup.html popup.js background.js style.css sjcl.js locales.js build/chromium/
          cp -r icons build/chromium/
          cp -r build/chromium/. build/firefox/
          cp manifest.firefox.json build/firefox/manifest.json

      - name: Lint Firefox build (addons-linter)
        continue-on-error: true
        run: npx --yes addons-linter build/firefox --channel=unlisted

      - name: Package for Chromium (.zip)
        run: |
          cd build/chromium
          zip -r -X "../../cookie-backup-chrome-${VERSION}-chromium.zip" .
          cd ../..

      - name: Package for Firefox (.xpi)
        run: |
          cd build/firefox
          zip -r -X "../../cookie-backup-chrome-${VERSION}-firefox.xpi" .
          cd ../..

      - uses: actions/upload-artifact@v7
        with:
          name: cookie-backup-chrome-${{ env.VERSION }}-chromium
          path: cookie-backup-chrome-*-chromium.zip

      - uses: actions/upload-artifact@v7
        with:
          name: cookie-backup-chrome-${{ env.VERSION }}-firefox
          path: cookie-backup-chrome-*-firefox.xpi

      - name: Attach builds to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cookie-backup-chrome-*-chromium.zip
            cookie-backup-chrome-*-firefox.xpi
